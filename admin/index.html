<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hindivine Admin</title>
  <meta name="description" content="Hindivine Admin: sales, patients, team incentives, salary, stock, purchases, expenses, renewals and reports.">
  <meta name="theme-color" content="#0A2F55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hindivine Admin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../img/icon-192.png">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- PIN lock (admin only) -->
  <div class="lock" id="lock" hidden>
    <form class="lock-card" id="lock-form" autocomplete="off">
      <img src="../img/logo.jpg" alt="Hindivine Healthcare" class="lock-logo" width="900" height="308">
      <h1>Hindivine Admin</h1>
      <p id="lock-msg">Enter your admin PIN</p>
      <input type="password" inputmode="numeric" pattern="[0-9]*" id="lock-pin" maxlength="8" placeholder="PIN" aria-label="PIN" required>
      <input type="password" inputmode="numeric" pattern="[0-9]*" id="lock-pin2" maxlength="8" placeholder="Repeat PIN" aria-label="Repeat PIN" hidden>
      <button class="btn primary" type="submit" id="lock-btn">Unlock</button>
      <small class="err" id="lock-err"></small>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="side" id="side" aria-label="Main menu">
      <div class="side-head">
        <img src="../img/icon-192.png" alt="" width="40" height="40">
        <div><b>Hindivine Admin</b><small id="side-sub">Admin only</small></div>
      </div>
      <nav id="nav"></nav>
      <button type="button" class="side-lock" data-act="lock">Lock app</button>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="top">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="title">Dashboard</h1>
        <span class="sync" id="sync-state" hidden></span>
        <button type="button" class="btn primary sm" data-go="sell">+ Sale</button>
      </header>
      <main id="view"></main>
    </div>

    <nav class="tabs" id="tabs" aria-label="Quick menu"></nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
      <small class="err" id="modal-err"></small>
      <footer id="modal-foot"></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/invoice.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
