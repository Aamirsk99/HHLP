<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>The Prime Fit Admin</title>
  <meta name="description" content="The Prime Fit Admin: OPD appointments, leads CRM, sales, patients, team incentives, salary, stock, purchases, expenses, renewals and reports.">
  <meta name="theme-color" content="#015B53">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prime Fit Admin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../img/icon-192.png">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <link rel="stylesheet" href="css/admin.css">
  <script>
    // Theme and light/dark mode, shared with the diet charts (Settings → Theme).
    try { const d = document.documentElement; d.dataset.theme = localStorage.getItem('primefit.theme') || 'teal'; d.dataset.mode = localStorage.getItem('primefit.mode') || 'auto'; } catch (_) { /* default theme */ }
  </script>
</head>
<body>
  <!-- Sign-in: each person has a user ID and password -->
  <div class="lock" id="lock" hidden>
    <div class="lock-card">
      <img src="../img/logo.png" alt="The Prime Fit" class="lock-logo" width="877" height="286">
      <div id="lock-body"></div>
    </div>
    <p class="lock-foot">The Prime Fit · www.theprimefit.in<br><span>Developed by Aamir Sk · The Prime Fit Digital Marketing Team</span></p>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="side" id="side" aria-label="Main menu">
      <div class="side-head">
        <img src="../img/icon-192.png" alt="" width="42" height="42">
        <div><b>The Prime Fit</b><small id="side-sub"></small></div>
      </div>
      <div class="side-quick" id="side-quick"></div>
      <label class="side-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="nav-q" placeholder="Search menu" aria-label="Search menu" autocomplete="off"></label>
      <nav id="nav"></nav>
      <a class="side-lock side-diet" href="../index.html">
        <svg viewBox="0 0 24 24"><path d="M7 3v8a3 3 0 0 0 6 0V3M10 3v18M17 3c-2 2-2 6 0 8v10"/></svg>Diet charts</a>
      <button type="button" class="side-lock" data-act="lock">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Log out</button>
      <p class="side-credit"></p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="top">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="top-title"><h1 id="title">Dashboard</h1><small id="top-sub"></small></div>
        <button type="button" class="icon-btn bell-btn" id="bell-btn" data-act="alerts" aria-label="Alerts" title="Alerts">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><i id="bell-n" hidden></i>
        </button>
        <button type="button" class="icon-btn" id="refresh-btn" data-act="refresh" aria-label="Refresh data" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        </button>
        <button type="button" class="user-chip" id="user-chip" data-act="user-menu" aria-label="Account"><span id="user-initial">S</span></button>
      </header>
      <div class="ptr" id="ptr"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></div>
      <main id="view"></main>
    </div>

    <nav class="tabs" id="tabs" aria-label="Quick menu"></nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
      <small class="err" id="modal-err"></small>
      <footer id="modal-foot"></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  </script>
</body>
</html>
