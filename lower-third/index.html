<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindivine Lower Third</title>
<!--
  Hindivine Healthcare — lower third overlay (transparent background).

  Use in OBS / vMix / Streamlabs as a "Browser Source", or open in a browser
  and screen-record. Options via URL query string:
    ?format=reel     9:16 vertical layout, 1080×1920 (default: 16:9, 1920×1080)
    ?bg=green        chroma-key green background (for editors without alpha)
    ?bg=dark         dark preview background
    ?hold=ms         how long it stays on screen before wiping out (default 8000)
    ?loop=0          play in once and stay on screen (default: loop in/out)
    ?static=1        no animation (used for PNG export)
    ?handle=@name    social media handle shown next to the icons
    ?phone=... ?phone2=... ?web=... ?email=...   override contact text
    ?t=ms            freeze at a point in the animation (used for video export)
-->
<script>
  if (new URLSearchParams(location.search).get('format') === 'reel') document.documentElement.className = 'reel';
</script>
<style>
  :root {
    --navy: #0a2f55;
    --brand: #0e6fb5;
    --sky: #29a8e0;
    --grey: #7d6f66;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  html.reel, html.reel body { width: 1080px; height: 1920px; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body.bg-green { background: #00b140; }
  body.bg-green .lt { filter: none; } /* clean chroma key: no soft shadow */
  body.bg-dark { background: linear-gradient(135deg, #1d2733, #3b4a5c); }

  .lt {
    position: absolute;
    left: 96px;
    bottom: 84px;
    display: flex;
    align-items: stretch;
    filter: drop-shadow(0 14px 30px rgba(10, 47, 85, .35));
  }
  .card { display: flex; align-items: stretch; }

  /* Accent bar with a light running through it */
  .bar {
    width: 14px;
    background: linear-gradient(180deg, var(--sky), var(--brand), var(--sky), var(--brand));
    background-size: 100% 300%;
    border-radius: 8px 0 0 8px;
    transform-origin: bottom;
  }

  /* Logo panel */
  .logo {
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 34px 18px 26px;
    overflow: hidden;
  }
  .logo img { height: 150px; display: block; }

  /* Info panel */
  .info {
    background: linear-gradient(100deg, var(--navy) 0%, #0c4277 70%, var(--brand) 100%);
    color: var(--white);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 20px 48px 20px 36px;
    border-radius: 0 8px 8px 0;
    position: relative;
    overflow: hidden;
  }
  .info::after { /* slanted highlight */
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: -40px;
    width: 120px;
    background: rgba(41, 168, 224, .18);
    transform: skewX(-20deg);
  }
  .info::before { /* shine sweep */
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: -40%;
    width: 22%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
  }

  .row { display: flex; align-items: center; gap: 30px; }
  .item { display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .item svg { width: 34px; height: 34px; flex: none; fill: var(--sky); }
  .sep { width: 2px; height: 34px; background: rgba(255, 255, 255, .28); transform-origin: center; }

  .social { gap: 14px; }
  .social .ico {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    display: grid; place-items: center;
  }
  .social .ico svg { width: 24px; height: 24px; fill: var(--white); }
  .social .handle { font-size: 30px; font-weight: 600; margin-left: 8px; color: #d9efff; white-space: nowrap; }

  /* ---- 9:16 Reels / Shorts layout: stacked card, kept clear of the app's
         caption area (bottom) and action buttons (right) ---- */
  .reel .lt { left: 64px; right: 150px; bottom: 470px; }
  .reel .card { flex-direction: column; flex: 1; }
  .reel .logo { padding: 26px 30px; }
  .reel .logo img { height: 170px; }
  .reel .info { padding: 30px 40px 32px; gap: 16px; border-radius: 0 0 8px 0; }
  .reel .row { flex-direction: column; align-items: flex-start; gap: 16px; }
  .reel .row .sep { display: none; }
  .reel .item { font-size: 40px; }
  .reel .item svg { width: 40px; height: 40px; }
  .reel .social { flex-direction: row; flex-wrap: wrap; gap: 14px; margin-top: 6px; }
  .reel .social .ico { width: 58px; height: 58px; }
  .reel .social .ico svg { width: 30px; height: 30px; }
  .reel .social .handle { flex-basis: 100%; margin: 4px 0 0; font-size: 36px; }
  .reel .bar { border-radius: 8px 0 0 8px; }

  /* ---- Animation ----
     Entrance: bar grows -> logo wipes in with a zoom -> info panel wipes in ->
     each contact line rises in turn -> social icons pop one by one -> handle types on.
     While on screen: light runs through the bar, a shine sweeps the panel,
     phone icons ring, social icons do a small wave. Exit: wipe to the left. */
  .play .bar  { animation: barIn .45s cubic-bezier(.2,.8,.2,1) both, shimmer 3s linear .5s infinite; }
  .play .logo { animation: wipe .6s cubic-bezier(.2,.8,.2,1) .25s both; }
  .play .logo img { animation: zoom 1.1s cubic-bezier(.2,.8,.2,1) .25s both; }
  .play .info { animation: wipe .7s cubic-bezier(.2,.8,.2,1) .55s both; }
  .reel.play .info, .reel .play .info { animation-name: wipeDown; }
  .play .info::before { animation: shine 4.5s ease-in-out 1.9s infinite; }
  .play .item { animation: rise .5s cubic-bezier(.2,.8,.2,1) var(--d) both; }
  .play .sep  { animation: grow .4s ease-out var(--d) both; }
  .play .ring svg { animation: ring 3.5s ease-in-out calc(var(--d) + 1.2s) infinite; transform-origin: 50% 50%; }
  .play .ico  { animation: pop .5s cubic-bezier(.3,1.6,.5,1) var(--d) both, wave 5s ease-in-out calc(var(--d) + 2.4s) infinite; }
  .play .handle { animation: type 1s steps(20, end) var(--d) both; }
  .play.out .lt { animation: wipeOut .5s cubic-bezier(.6,0,.8,.2) both; }

  @keyframes barIn   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 0 100%; } }
  @keyframes wipe    { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wipeDown { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes zoom    { from { transform: scale(1.18); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes rise    { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes grow    { from { transform: scaleY(0); } to { transform: none; } }
  @keyframes pop     { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes type    { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes shine   { 0% { left: -40%; } 30%, 100% { left: 130%; } }
  @keyframes ring {
    0%, 16%, 100% { transform: rotate(0); }
    2%  { transform: rotate(-16deg); }  4% { transform: rotate(16deg); }
    6%  { transform: rotate(-14deg); }  8% { transform: rotate(14deg); }
    10% { transform: rotate(-8deg); }  12% { transform: rotate(8deg); }
  }
  @keyframes wave    { 0%, 10%, 100% { transform: none; } 5% { transform: translateY(-9px) scale(1.08); } }
  @keyframes wipeOut { from { clip-path: inset(-60px -60px -60px -60px); } to { clip-path: inset(-60px 100% -60px -60px); } }
</style>
</head>
<body>
<div id="stage">
  <div class="lt">
    <div class="bar"></div>
    <div class="card">
      <div class="logo"><img src="../img/logo.jpg" alt="Hindivine Healthcare Private Limited"></div>
      <div class="info">
        <div class="row">
          <div class="item ring" style="--d:1.05s">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            <span id="phone">+91 88899 95465</span>

            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            <span id="phone2">+91 99589 00473</span>
          </div>
        </div>
        <div class="row">
          <div class="item" style="--d:1.35s">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8 8 0 0 1 18.9 8zM12 4.04A14 14 0 0 1 13.910 8h-3.82A14 14 0 0 1 12 4.04zM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4zm.84 2h2.95a15.7 15.7 0 0 0 1.38 3.56A8 8 0 0 1 5.1 16zM8.05 8H5.1a8 8 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.05 8zM12 19.96A14 14 0 0 1 10.09 16h3.820A14 14 0 0 1 12 19.96zM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4zm.25 5.56A15.7 15.7 0 0 0 15.95 16h2.95a8 8 0 0 1-4.31 3.56zM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4z"/></svg>
            <span id="web">www.hindivine.com</span>
          </div>
          <div class="sep" style="--d:1.45s"></div>
          <div class="item" style="--d:1.5s">
            <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4.24-8 5-8-5V6l8 5 8-5z"/></svg>
            <span id="email">info@hindivine.com</span>
          </div>
        </div>
        <div class="row social">
          <!-- Facebook -->
          <span class="ico" style="--d:1.7s"><svg viewBox="0 0 24 24"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.87.25-1.46 1.5-1.46h1.55V4.47A21 21 0 0 0 14.3 4.3c-2.25 0-3.8 1.37-3.8 3.9v2.3H8v3h2.5V21z"/></svg></span>
          <!-- Instagram -->
          <span class="ico" style="--d:1.8s"><svg viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.98a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM20.94 8.1c-.05-1.35-.36-2.55-1.350-3.53S17.4 3.27 16.06 3.2C14.67 3.12 9.33 3.12 7.94 3.2c-1.34.07-2.54.38-3.53 1.36S3.12 6.75 3.06 8.1c-.08 1.39-.08 6.42 0 7.81.06 1.35.37 2.55 1.35 3.53s2.19 1.29 3.53 1.36c1.39.08 6.73.08 8.12 0 1.34-.07 2.54-.38 3.53-1.36s1.29-2.18 1.35-3.53c.08-1.39.08-6.42 0-7.81zm-1.95 9.83a2.9 2.9 0 0 1-1.63 1.63c-1.13.45-3.8.34-5.04.34s-3.92.1-5.04-.34a2.9 2.9 0 0 1-1.63-1.63c-.45-1.13-.35-3.8-.35-5.04s-.1-3.92.35-5.04A2.9 2.9 0 0 1 6.28 5.2c1.13-.45 3.8-.34 5.04-.34s3.92-.1 5.04.34a2.9 2.9 0 0 1 1.63 1.63c.45 1.13.35 3.8.35 5.04s.1 3.92-.35 5.04z"/></svg></span>
          <!-- YouTube -->
          <span class="ico" style="--d:1.9s"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.77-1.77C18.27 5 12 5 12 5s-6.27 0-7.830.43A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.77 1.77C5.73 19 12 19 12 19s6.27 0 7.83-.43a2.5 2.5 0 0 0 1.77-1.77A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg></span>

          <span class="ico" style="--d:2.0s"><svg viewBox="0 0 24 24"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77zm-1.08 16.2h1.7L7.4 4.73H5.58z"/></svg></span>
          <!-- LinkedIn -->
          <span class="ico" style="--d:2.1s"><svg viewBox="0 0 24 24"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 8.48H3V21h4zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91z"/></svg></span>
          <!-- WhatsApp -->
          <span class="ico" style="--d:2.2s"><svg viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.98L2 22l5.17-1.5A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.07.89.9-2.99-.2-.31a8.2 8.2 0 1 1 6.87 3.74zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8s-.39-.12-.55.12-.63.8-.78.97-.29.18-.53.06a6.7 6.7 0 0 1-3.32-2.9c-.25-.43.25-.4.72-1.33a.45.45 0 0 0-.02-.43c-.06-.12-.55-1.33-.76-1.820s-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.74 2.74 0 0 0-.85 2.03 4.76 4.76 0 0 0 1 2.53 10.9 10.9 0 0 0 4.17 3.68c1.55.67 2.16.73 2.93.61a2.5 2.5 0 0 0 1.65-1.16 2.04 2.04 0 0 0 .14-1.16c-.06-.1-.22-.16-.47-.28z"/></svg></span>
          <span class="handle" id="handle" style="--d:2.35s">@hindivinehealthcare</span>
        </div>
      </div>

  </div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var stage = document.getElementById('stage');
    if (q.get('bg') === 'green') document.body.classList.add('bg-green');
    if (q.get('bg') === 'dark') document.body.classList.add('bg-dark');
    ['handle', 'phone', 'phone2', 'web', 'email'].forEach(function (k) {
      if (q.get(k)) document.getElementById(k).textContent = q.get(k);
    });

    if (q.get('static') === '1') return;

    var HOLD = +q.get('hold') || 8000, GAP = 3000;

    // Frame-accurate seek, used by the video exporter: window.seek(ms)
    window.seek = function (t) {
      stage.className = t < HOLD ? 'play' : 'play out';
      document.getAnimations().forEach(function (a) {
        a.pause();
        var isOut = a.animationName === 'wipeOut';
        a.currentTime = isOut ? t - HOLD : Math.min(t, HOLD);
      });
    };
    if (q.has('t')) { window.seek(+q.get('t')); return; }

    var loop = q.get('loop') !== '0';
    function play() {
      stage.className = '';
      void stage.offsetWidth; // restart CSS animations
      stage.className = 'play';
      if (loop) {
        setTimeout(function () { stage.className = 'play out'; }, HOLD);
        setTimeout(play, HOLD + GAP);
      }
    }
    play();
  })();
</script>
</body>
</html>
