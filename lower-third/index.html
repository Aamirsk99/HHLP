<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Hindivine Lower Third</title>
<!--
  Hindivine Healthcare — lower third overlay (1920×1080, transparent).

  Use in OBS / vMix / Streamlabs as a "Browser Source" (1920×1080), or open in a
  browser and screen-record. Options via URL query string:
    ?bg=green        chroma-key green background (for editors without alpha)
    ?bg=dark         dark preview background
    ?loop=0          play in once and stay on screen (default: loop in/out)
    ?static=1        no animation (used for PNG export)
    ?handle=@name    social media handle shown next to the icons
    ?phone=...  ?web=...   override contact text
-->
<style>
  :root {
    --navy: #0a2f55;
    --brand: #0e6fb5;
    --sky: #29a8e0;
    --grey: #7d6f66;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.bg-green { background: #00b140; }
  body.bg-dark { background: linear-gradient(135deg, #1d2733, #3b4a5c); }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

  .lt {
    position: absolute;
    left: 96px;
    bottom: 84px;
    display: flex;
    align-items: stretch;
    filter: drop-shadow(0 14px 30px rgba(10, 47, 85, .35));
  }

  /* Accent bar */
  .bar {
    width: 14px;
    background: linear-gradient(180deg, var(--sky), var(--brand));
    border-radius: 8px 0 0 8px;
    transform-origin: bottom;
  }

  /* Logo panel */
  .logo {
    background: var(--white);
    display: flex;
    align-items: center;
    padding: 18px 34px 18px 26px;
    clip-path: inset(0 100% 0 0);
  }
  .logo img { height: 112px; display: block; }

  /* Info panel */
  .info {
    background: linear-gradient(100deg, var(--navy) 0%, #0c4277 70%, var(--brand) 100%);
    color: var(--white);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 18px 44px 18px 36px;
    border-radius: 0 8px 8px 0;
    clip-path: inset(0 100% 0 0);
    position: relative;
    overflow: hidden;
  }
  .info::after { /* slanted highlight */
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: -40px;
    width: 120px;
    background: rgba(41, 168, 224, .18);
    transform: skewX(-20deg);
  }

  .row { display: flex; align-items: center; gap: 30px; opacity: 0; }
  .item { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .item svg { width: 34px; height: 34px; flex: none; fill: var(--sky); }
  .sep { width: 2px; height: 34px; background: rgba(255, 255, 255, .28); }

  .social { gap: 14px; }
  .social .ico {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    display: grid; place-items: center;
  }
  .social .ico svg { width: 24px; height: 24px; fill: var(--white); }
  .social .handle { font-size: 30px; font-weight: 600; margin-left: 8px; color: #d9efff; }

  /* ---- Animation ---- */
  .play .bar  { animation: barIn .45s cubic-bezier(.2,.8,.2,1) both; }
  .play .logo { animation: wipe .6s cubic-bezier(.2,.8,.2,1) .25s both; }
  .play .info { animation: wipe .7s cubic-bezier(.2,.8,.2,1) .55s both; }
  .play .row1 { animation: rise .5s ease-out 1.05s both; }
  .play .row2 { animation: rise .5s ease-out 1.25s both; }
  .play.out .lt { animation: fadeOut .5s ease-in both; }

  .static .logo, .static .info { clip-path: none; }
  .static .row { opacity: 1; }

  @keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeOut { to { opacity: 0; transform: translateX(-40px); } }
</style>
</head>
<body>
<div id="stage">
  <div class="lt">
    <div class="bar"></div>
    <div class="logo"><img src="../img/logo.jpg" alt="Hindivine Healthcare Private Limited"></div>
    <div class="info">
      <div class="row row1">
        <div class="item">
          <!-- phone -->
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          <span id="phone">+91 88899 95465</span>
        </div>
        <div class="sep"></div>
        <div class="item">
          <!-- globe -->
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8 8 0 0 1 18.9 8zM12 4.04A14 14 0 0 1 13.91 8h-3.82A14 14 0 0 1 12 4.04zM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4zm.84 2h2.95a15.7 15.7 0 0 0 1.38 3.56A8 8 0 0 1 5.1 16zM8.05 8H5.1a8 8 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.05 8zM12 19.96A14 14 0 0 1 10.09 16h3.82A14 14 0 0 1 12 19.96zM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4zm.25 5.56A15.7 15.7 0 0 0 15.95 16h2.95a8 8 0 0 1-4.31 3.56zM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4z"/></svg>
          <span id="web">www.hindivine.com</span>
        </div>
      </div>
      <div class="row row2 social">
        <!-- Facebook -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.87.25-1.46 1.5-1.46h1.55V4.47A21 21 0 0 0 14.3 4.3c-2.25 0-3.8 1.37-3.8 3.9v2.3H8v3h2.5V21z"/></svg></span>
        <!-- Instagram -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.98a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM20.94 8.1c-.05-1.35-.36-2.55-1.35-3.53S17.4 3.27 16.06 3.2C14.67 3.12 9.33 3.12 7.94 3.2c-1.34.07-2.54.38-3.53 1.36S3.12 6.75 3.06 8.1c-.08 1.39-.08 6.42 0 7.81.06 1.35.37 2.55 1.35 3.53s2.19 1.29 3.53 1.36c1.39.08 6.73.08 8.12 0 1.34-.07 2.54-.38 3.53-1.36s1.29-2.18 1.35-3.53c.08-1.39.08-6.42 0-7.81zm-1.95 9.83a2.9 2.9 0 0 1-1.63 1.63c-1.13.45-3.8.34-5.04.34s-3.92.1-5.04-.34a2.9 2.9 0 0 1-1.63-1.63c-.45-1.13-.35-3.8-.35-5.04s-.1-3.92.35-5.04A2.9 2.9 0 0 1 6.28 5.2c1.13-.45 3.8-.34 5.04-.34s3.92-.1 5.04.34a2.9 2.9 0 0 1 1.63 1.63c.45 1.13.35 3.8.35 5.04s.1 3.92-.35 5.04z"/></svg></span>
        <!-- YouTube -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.77-1.77C18.27 5 12 5 12 5s-6.27 0-7.83.43A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.77 1.77C5.73 19 12 19 12 19s6.27 0 7.83-.43a2.5 2.5 0 0 0 1.77-1.77A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg></span>
        <!-- X -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77zm-1.08 16.2h1.7L7.4 4.73H5.58z"/></svg></span>
        <!-- LinkedIn -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 8.48H3V21h4zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91z"/></svg></span>
        <!-- WhatsApp -->
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.98L2 22l5.17-1.5A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.07.89.9-2.99-.2-.31a8.2 8.2 0 1 1 6.87 3.74zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8s-.39-.12-.55.12-.63.8-.78.97-.29.18-.53.06a6.7 6.7 0 0 1-3.32-2.9c-.25-.43.25-.4.72-1.33a.45.45 0 0 0-.02-.43c-.06-.12-.55-1.33-.76-1.82s-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.74 2.74 0 0 0-.85 2.03 4.76 4.76 0 0 0 1 2.53 10.9 10.9 0 0 0 4.17 3.68c1.55.67 2.16.73 2.93.61a2.5 2.5 0 0 0 1.65-1.16 2.04 2.04 0 0 0 .14-1.16c-.06-.1-.22-.16-.47-.28z"/></svg></span>
        <span class="handle" id="handle">@hindivinehealthcare</span>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var stage = document.getElementById('stage');
    if (q.get('bg') === 'green') document.body.classList.add('bg-green');
    if (q.get('bg') === 'dark') document.body.classList.add('bg-dark');
    ['handle', 'phone', 'web'].forEach(function (k) {
      if (q.get(k)) document.getElementById(k).textContent = q.get(k);
    });

    if (q.get('static') === '1') { stage.className = 'static'; return; }

    var loop = q.get('loop') !== '0';
    var HOLD = 8000, GAP = 3000;
    function play() {
      stage.className = '';
      void stage.offsetWidth; // restart CSS animations
      stage.className = 'play';
      if (loop) {
        setTimeout(function () { stage.className = 'play out'; }, HOLD);
        setTimeout(play, HOLD + GAP);
      }
    }
    play();
  })();
</script>
</body>
</html>
