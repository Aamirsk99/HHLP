<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindivine End Screen</title>
<!--
  Hindivine Healthcare — video end screen / outro (full frame).

  Open in a browser or add as an OBS / vMix "Browser Source". Options:
    ?format=reel   9:16 vertical layout, 1080×1920 (default: 16:9, 1920×1080)
    ?hold=ms       time before the final fade to dark (default 9400)
    ?static=1      no animation (used for PNG export)
    ?handle=@name  ?phone=... ?phone2=... ?web=... ?email=...   override text
    ?t=ms          freeze at a point in the animation (used for video export)
-->
<script>
  if (new URLSearchParams(location.search).get('format') === 'reel') document.documentElement.className = 'reel';
</script>
<style>
  :root {
    --navy: #0a2f55;
    --brand: #0e6fb5;
    --sky: #29a8e0;
    --white: #ffffff;
    --red: #e62117;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  html.reel, html.reel body { width: 1080px; height: 1920px; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse at 50% 35%, #0f5596 0%, var(--navy) 62%, #061d36 100%);
  }

  /* ---- Background: drifting soft lights + fine diagonal lines ---- */
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(-35deg, rgba(255,255,255,.035) 0 2px, transparent 2px 46px);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 620px; height: 620px; background: var(--sky); left: -180px; top: -200px; }
  .b2 { width: 520px; height: 520px; background: var(--brand); right: -140px; bottom: -180px; }
  .b3 { width: 360px; height: 360px; background: #3cc3f2; right: 22%; top: -160px; opacity: .3; }

  /* ---- Content ---- */
  .wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; text-align: center;
  }
  .logo-card {
    background: var(--white); border-radius: 22px;
    padding: 26px 46px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .logo-card img { height: 170px; display: block; }

  .thanks { font-size: 84px; font-weight: 800; letter-spacing: .5px; line-height: 1.05; }
  .thanks span { color: var(--sky); }
  .underline { width: 220px; height: 6px; border-radius: 3px; margin: -14px auto 0; background: linear-gradient(90deg, var(--sky), var(--brand)); }
  .sub { font-size: 36px; color: #cfe6f7; font-weight: 500; margin-top: -10px; }

  .contacts { display: grid; grid-template-columns: repeat(2, auto); gap: 18px 22px; }
  .chip {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255, 255, 255, .09);
    border: 1.5px solid rgba(255, 255, 255, .18);
    border-radius: 999px;
    padding: 14px 34px 14px 16px;
    font-size: 34px; font-weight: 600; white-space: nowrap;
  }
  .chip .ic {
    width: 54px; height: 54px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--sky), var(--brand));
    display: grid; place-items: center;
  }
  .chip .ic svg { width: 28px; height: 28px; fill: var(--white); }

  .social { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .ico {
    width: 62px; height: 62px; border-radius: 50%;
    background: var(--white);
    display: grid; place-items: center;
  }
  .ico svg { width: 32px; height: 32px; fill: var(--navy); }
  .handle { font-size: 34px; font-weight: 600; color: #d9efff; margin: 0 22px 0 10px; white-space: nowrap; }
  .subscribe {
    display: flex; align-items: center; gap: 12px;
    background: var(--red); color: var(--white);
    font-size: 30px; font-weight: 800; letter-spacing: 1.5px;
    padding: 14px 30px; border-radius: 12px;
    box-shadow: 0 10px 26px rgba(230, 33, 23, .4);
  }
  .subscribe .bell { width: 32px; height: 32px; fill: var(--white); transform-origin: 50% 10%; }

  .thanks em { font-style: normal; display: inline-block; }
  .thanks span { display: inline-block; }

  /* heartbeat line + rising medical crosses */
  .ecg { position: absolute; left: 0; width: 100%; top: 34%; height: 200px; overflow: visible; }
  .ecg polyline { fill: none; stroke: var(--sky); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .35; filter: drop-shadow(0 0 8px var(--sky)); }
  .plus { position: absolute; bottom: -80px; font-style: normal; font-weight: 800; color: var(--sky); opacity: 0; line-height: 1; }

  /* logo card shine */
  .logo-card { position: relative; overflow: hidden; }
  .logo-card::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 25%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg); }

  .underline { background-size: 200% 100%; background-image: linear-gradient(90deg, var(--sky), var(--brand), #9fe3ff, var(--sky)); }

  /* subscribe: label swap + cursor */
  .subscribe { position: relative; }
  .lbl { display: grid; font-weight: 800; }
  .lbl b { grid-area: 1 / 1; font-weight: 800; text-align: left; }
  .s2 { opacity: 0; }
  .cursor { position: absolute; width: 46px !important; height: 46px !important; left: 60%; top: 55%;
    fill: var(--white) !important; stroke: #111; stroke-width: 1.2; opacity: 0; transform-origin: 0 0; }

  .fade { position: absolute; inset: 0; background: #041427; opacity: 0; pointer-events: none; }

  /* ---- 9:16 Reels / Shorts ---- */
  .reel .wrap { gap: 40px; padding: 0 70px 160px; }
  .reel .logo-card img { height: 190px; }
  .reel .thanks { font-size: 96px; }
  .reel .thanks span { display: block; }
  .reel .sub { font-size: 40px; }
  .reel .contacts { grid-template-columns: 1fr; gap: 20px; }
  .reel .chip { font-size: 40px; padding: 16px 40px 16px 18px; }
  .reel .chip .ic { width: 62px; height: 62px; }
  .reel .chip .ic svg { width: 32px; height: 32px; }
  .reel .social { max-width: 760px; gap: 18px; }
  .reel .ico { width: 78px; height: 78px; }
  .reel .ico svg { width: 40px; height: 40px; }
  .reel .handle { flex-basis: 100%; margin: 8px 0; font-size: 40px; }
  .reel .subscribe .bell { width: 38px; height: 38px; }
  .reel .subscribe { font-size: 36px; padding: 18px 40px; }
  .reel .b1 { width: 700px; height: 700px; left: -260px; top: -160px; }
  .reel .b2 { width: 640px; height: 640px; right: -260px; bottom: -120px; }
  .reel .b3 { right: 10%; top: 40%; }

  /* ---- Animation ----
     Lights drift in the background throughout. Logo card drops in and settles,
     "Thank you" rises with a growing underline, contact chips slide in one by one,
     social icons pop, handle types on, subscribe button pulses with a ringing bell.
     Ends with a fade to dark. */
  .play .b1 { animation: drift1 12s ease-in-out infinite alternate; }
  .play .b2 { animation: drift2 14s ease-in-out infinite alternate; }
  .play .b3 { animation: drift3 10s ease-in-out infinite alternate; }
  .play .bg { animation: fadeIn .8s ease-out both; }
  .play .logo-card { animation: drop .9s cubic-bezier(.3,1.4,.5,1) .3s both, float 6s ease-in-out 2s infinite; }
  .play .thanks em { animation: fromL .8s cubic-bezier(.2,.8,.2,1) 1s both; }
  .play .thanks span { animation: fromR .8s cubic-bezier(.2,.8,.2,1) 1.15s both, glow 3s ease-in-out 2.5s infinite; }
  .play .ecg polyline { animation: ecg 4s ease-in-out .6s infinite; }
  .play .plus { animation: floatUp var(--dur) linear var(--dl) infinite; }
  .play .logo-card::after { animation: shine 4s ease-in-out 1.3s infinite; }
  .play .chip .ic { animation: ripple 2.4s ease-out calc(var(--d) + .8s) infinite; }
  .play .cursor { animation: cursor 2.4s ease-in-out 5s both; }
  .play .subscribe .s1 { animation: hide .01s linear 6.15s forwards; }
  .play .subscribe .s2 { animation: show .01s linear 6.15s forwards; }
  .play .underline { animation: grow .6s cubic-bezier(.2,.8,.2,1) 1.4s both, slideBg 2.5s linear 2s infinite; }
  .play .sub { animation: rise .6s cubic-bezier(.2,.8,.2,1) 1.5s both; }
  .play .chip { animation: slide .6s cubic-bezier(.2,.8,.2,1) var(--d) both; }
  .play .ico { animation: pop .5s cubic-bezier(.3,1.6,.5,1) var(--d) both, wave 5s ease-in-out calc(var(--d) + 2s) infinite; }
  .play .handle { animation: type 1s steps(20, end) var(--d) both; }
  .play .subscribe { animation: pop .5s cubic-bezier(.3,1.6,.5,1) 3.6s both, pulse 1.6s ease-in-out 4.2s 1, press .3s ease-in-out 6s, subbed .2s linear 6.15s forwards, pulse 1.6s ease-in-out 7.6s infinite; }
  .play .subscribe .bell { animation: ring 1.6s ease-in-out 4.2s infinite; }
  .play.out .fade { animation: fadeIn .6s ease-in both; }

  @keyframes fromL { from { opacity: 0; transform: translateX(-140px); } to { opacity: 1; transform: none; } }
  @keyframes fromR { from { opacity: 0; transform: translateX(140px); } to { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { text-shadow: 0 0 0 rgba(41,168,224,0); } 50% { text-shadow: 0 0 28px rgba(41,168,224,.85); } }
  @keyframes ecg { 0% { stroke-dashoffset: 1; opacity: .4; } 55% { stroke-dashoffset: 0; opacity: .4; } 80%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: var(--o); } 85% { opacity: var(--o); }
    100% { transform: translateY(var(--rise, -1300px)) rotate(180deg); opacity: 0; } }
  .reel .plus { --rise: -2200px; }
  @keyframes shine { 0% { left: -40%; } 35%, 100% { left: 130%; } }
  @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(41,168,224,.7); } 70%, 100% { box-shadow: 0 0 0 18px rgba(41,168,224,0); } }
  @keyframes slideBg { from { background-position: 0 0; } to { background-position: 200% 0; } }
  @keyframes cursor {
    0% { opacity: 0; transform: translate(220px, 160px); }
    15% { opacity: 1; }
    45% { opacity: 1; transform: translate(0, 0); }
    50% { transform: translate(0, 0) scale(.8); }
    55% { transform: translate(0, 0) scale(1); }
    80% { opacity: 1; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(160px, 140px); }
  }
  @keyframes press { 0%, 100% { transform: scale(1); } 50% { transform: scale(.9); } }
  @keyframes subbed { to { background: #5b6675; box-shadow: 0 10px 26px rgba(0,0,0,.3); } }
  @keyframes hide { to { opacity: 0; } }
  @keyframes show { to { opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drift1 { to { transform: translate(260px, 160px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-240px, -140px) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-200px, 120px) scale(.85); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-80px) scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: none; } 50% { transform: translateY(-8px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(var(--x, -60px)); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wave { 0%, 10%, 100% { transform: none; } 5% { transform: translateY(-10px) scale(1.08); } }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes ring {
    0%, 40%, 100% { transform: rotate(0); }
    8% { transform: rotate(-18deg); } 16% { transform: rotate(16deg); }
    24% { transform: rotate(-12deg); } 32% { transform: rotate(10deg); }
  }
</style>
</head>

<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var stage = document.getElementById('stage');
    ['handle', 'phone', 'phone2', 'web', 'email'].forEach(function (k) {
      if (q.get(k)) document.getElementById(k).textContent = q.get(k);
    });
    if (q.get('static') === '1') return;

    var HOLD = +q.get('hold') || 9400;

    // Frame-accurate seek, used by the video exporter: window.seek(ms)
    window.seek = function (t) {
      stage.className = t < HOLD ? 'play' : 'play out';
      document.getAnimations().forEach(function (a) {
        a.pause();
        var isOut = a.effect && a.effect.target && a.effect.target.classList.contains('fade');
        a.currentTime = isOut ? t - HOLD : t;
      });
    };
    if (q.has('t')) { window.seek(+q.get('t')); return; }

    stage.className = 'play';
    setTimeout(function () { stage.className = 'play out'; }, HOLD);
  })();
</script>
