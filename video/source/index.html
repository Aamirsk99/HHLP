<!doctype html>
<html><head><meta charset="utf-8"><title>Hindivine App Video</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1170B5;--sky:#29A8E0;--deep:#062a4f;--ink:#0f2236;--mut:#5b6f85;--green:#16a34a}
html,body{width:1080px;height:1920px;overflow:hidden;background:#062a4f;font-family:Inter,'Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 20% 0%,#1a8ad6 0%,#0d5c9c 40%,#062a4f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h1{font-family:'Inter Display',Inter;font-weight:800;letter-spacing:-2px}
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}
/* step header */
.stephead{position:absolute;left:80px;right:80px;top:120px}
.badge{display:inline-flex;align-items:center;gap:14px;padding:12px 26px;border-radius:999px;font-weight:700;font-size:30px;letter-spacing:3px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.badge b{background:#fff;color:var(--blue);border-radius:999px;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;font-size:28px}
.stitle{font-family:'Inter Display';font-weight:800;font-size:76px;line-height:1.05;letter-spacing:-1.5px;margin-top:30px}
.ssub{font-size:36px;line-height:1.35;color:#cfe6fa;margin-top:20px;font-weight:500}
.dots{position:absolute;bottom:52px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.dots i{width:16px;height:16px;border-radius:99px;background:rgba(255,255,255,.3)}
.dots i.on{width:56px;background:#fff}
/* phone */
.phone{position:absolute;left:250px;top:600px;width:580px;height:1180px;border-radius:84px;background:#0b1622;padding:20px;box-shadow:0 60px 120px rgba(0,0,0,.45),0 0 0 3px #2a3a4d inset}
.screen{position:relative;width:100%;height:100%;border-radius:66px;overflow:hidden;background:#f3f7fb;color:var(--ink)}
.notch{position:absolute;top:16px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#0b1622;z-index:20}
.status{position:absolute;top:0;left:0;right:0;height:70px;display:flex;justify-content:space-between;align-items:center;padding:12px 52px 0;font-weight:700;font-size:22px;z-index:19}
.pad{position:absolute;top:80px;left:0;right:0;bottom:0;padding:0 30px}
.btn{border-radius:22px;padding:24px;text-align:center;font-weight:700;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--blue))}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 30px rgba(17,112,181,.12);padding:24px}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(17,112,181,.35);border:4px solid rgba(255,255,255,.9);opacity:0;z-index:30;box-shadow:0 0 0 8px rgba(17,112,181,.15)}
.lbl{font-size:22px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:18px}
.av{width:84px;height:84px;border-radius:24px;background:url(logo.png) center/cover;flex:none}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;background:#e6f2fb;color:var(--blue);font-weight:700;font-size:22px;margin:0 8px 10px 0}
.bub{max-width:400px;padding:20px 24px;border-radius:28px;font-size:24px;line-height:1.35;margin-bottom:18px}
.in{background:#fff;border-bottom-left-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.out{background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;margin-left:auto;border-bottom-right-radius:8px}
.meal{display:flex;align-items:center;gap:18px;background:#fff;border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:0 6px 16px rgba(17,112,181,.08)}
.meal .e{font-size:40px;width:64px;height:64px;border-radius:18px;background:#eef6fd;display:flex;align-items:center;justify-content:center;flex:none}
.meal .t{font-size:19px;color:var(--mut);font-weight:700;letter-spacing:1px}
.meal .d{font-size:23px;font-weight:700;margin-top:2px}
.meal .k{margin-left:auto;font-size:20px;color:var(--blue);font-weight:800;white-space:nowrap}
/* benefits */
.bgrid{position:absolute;left:70px;right:70px;top:430px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.bcard{border-radius:36px;padding:36px 32px;min-height:290px;opacity:0}
.bcard .ic{font-size:64px;width:110px;height:110px;border-radius:30px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.bcard h3{font-size:36px;line-height:1.15;font-weight:800;font-family:'Inter Display'}
.bcard p{font-size:25px;line-height:1.35;color:#cfe6fa;margin-top:10px}
</style></head>
<body><div id="stage">
<div class="blob" id="b1" style="width:700px;height:700px;background:#29A8E0;left:-200px;top:200px"></div>
<div class="blob" id="b2" style="width:600px;height:600px;background:#5ad1ff;right:-200px;top:1100px"></div>
<div class="blob" id="b3" style="width:500px;height:500px;background:#1170B5;left:300px;top:-200px"></div>

<!-- INTRO -->
<div class="scene center" id="intro">
  <div id="introLogo" style="width:380px;height:380px;border-radius:96px;background:url(logo.png) center/cover;box-shadow:0 40px 100px rgba(0,0,0,.4),0 0 0 10px rgba(255,255,255,.12)"></div>
  <div id="introT1" class="h1" style="font-size:118px;margin-top:70px">Hindivine</div>
  <div id="introT2" style="font-size:46px;font-weight:600;color:#bfe3fb;letter-spacing:10px;margin-top:6px">PATIENT APP</div>
  <div id="introLine" style="width:200px;height:6px;border-radius:9px;background:#fff;margin:56px 0 46px"></div>
  <div id="introT3" style="font-size:48px;font-weight:600;line-height:1.3">Your health,<br>guided by experts.</div>
</div>

<!-- HOW TO TITLE -->
<div class="scene center" id="howto">
  <div id="howK" style="font-size:36px;letter-spacing:12px;color:#bfe3fb;font-weight:700">HOW TO USE</div>
  <div id="howT" class="h1" style="font-size:150px;line-height:1;margin:30px 0">7 easy<br>steps</div>
  <div id="howS" style="font-size:40px;color:#e3f2fd;font-weight:500">From download to your first diet chart</div>
</div>

<div id="steps"></div>

<!-- BENEFITS -->
<div class="scene" id="benefits">
  <div style="position:absolute;top:140px;left:70px;right:70px" id="benHead">
    <div class="badge">WHY HINDIVINE</div>
    <div class="stitle" style="font-size:88px">Benefits of the app</div>
  </div>
  <div class="bgrid" id="bgrid"></div>
</div>

<!-- CTA -->
<div class="scene center" id="cta">
  <div id="ctaLogo" style="width:300px;height:300px;border-radius:80px;background:url(logo.png) center/cover;box-shadow:0 40px 100px rgba(0,0,0,.4)"></div>
  <div id="ctaT" class="h1" style="font-size:96px;line-height:1.05;margin-top:70px">Start your<br>healthy journey<br>today</div>
  <div id="ctaS" style="font-size:40px;color:#cfe6fa;margin-top:36px;font-weight:500">Download the Hindivine Patient App</div>
  <div id="ctaPlay" style="margin-top:60px;display:flex;align-items:center;gap:26px;background:#000;border:3px solid #9aa4ad;border-radius:28px;padding:26px 50px">
    <svg width="74" height="82" viewBox="0 0 30 33"><path d="M1 1l16 16L1 32z" fill="#00d7fe"/><path d="M1 1l21 12-5 4z" fill="#00f076"/><path d="M1 32l16-15 5 4z" fill="#f83a4b"/><path d="M22 13l6 3.5-6 3.5-5-3.5z" fill="#ffd400"/></svg>
    <div style="text-align:left"><div style="font-size:24px;letter-spacing:2px;font-weight:600">GET IT ON</div><div style="font-size:52px;font-weight:700;margin-top:-4px">Google Play</div></div>
  </div>
  <div id="ctaW" style="margin-top:80px;font-size:38px;font-weight:700;letter-spacing:2px">www.hindivine.com</div>
  <div id="ctaC" style="margin-top:16px;font-size:26px;color:#9fc6e6">Hindivine Healthcare Private Limited</div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const EASE='cubic-bezier(.2,.8,.2,1)';
function an(el,kf,start,dur,o={}){if(typeof el==='string')el=$(el);
  el.animate(kf,{delay:start*1000,duration:dur*1000,fill:o.fill||'both',easing:o.ease||EASE,iterations:o.it||1});}
const fadeUp=(el,t,d=.8,dist=60)=>an(el,[{opacity:0,transform:`translateY(${dist}px)`},{opacity:1,transform:'none'}],t,d);
const popIn=(el,t,d=.7)=>an(el,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],t,d,{ease:'cubic-bezier(.34,1.56,.64,1)'});
function sceneSpan(el,a,b){an(el,[{opacity:0},{opacity:1}],a,.6);an(el,[{opacity:1},{opacity:0}],b-.6,.6,{fill:'forwards'});}
function tap(screen,x,y,t){const d=document.createElement('div');d.className='tap';d.style.left=x+'px';d.style.top=y+'px';screen.appendChild(d);
  an(d,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)',offset:.35},{opacity:0,transform:'scale(1.6)'}],t,.9,{fill:'forwards'});
  d.animate([{opacity:0}],{fill:'backwards',duration:1,delay:t*1000});}
// type text: element contains full text, reveal by clip
function typeIn(el,t,d,n){an(el,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],t,d,{ease:`steps(${n})`});}

// background blobs drift
an('#b1',[{transform:'translate(0,0)'},{transform:'translate(300px,400px)'},{transform:'translate(0,0)'}],0,30,{ease:'ease-in-out',it:4});
an('#b2',[{transform:'translate(0,0)'},{transform:'translate(-300px,-500px)'},{transform:'translate(0,0)'}],0,26,{ease:'ease-in-out',it:5});
an('#b3',[{transform:'translate(0,0)'},{transform:'translate(-200px,500px)'},{transform:'translate(0,0)'}],0,34,{ease:'ease-in-out',it:4});

// INTRO 0-6
sceneSpan('#intro',0,6.2);
an('#introLogo',[{opacity:0,transform:'scale(.3) rotate(-20deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],.2,1.2,{ease:'cubic-bezier(.34,1.56,.64,1)'});
fadeUp('#introT1',1.1);fadeUp('#introT2',1.5);
an('#introLine',[{width:'0px'},{width:'200px'}],2,.8);
fadeUp('#introT3',2.4,.9);
// HOW TO 6-9.5
sceneSpan('#howto',6,9.6);
fadeUp('#howK',6.3);popIn('#howT',6.6,.9);fadeUp('#howS',7.2);

const SB='<div class="notch"></div><div class="status"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const STEPS=[
{t:'Download the app',s:'Search “Hindivine” on Google Play and tap Install.',html:`
 <div class="pad" style="background:#fff">
  <div style="font-size:30px;font-weight:800;color:#202124;margin:20px 0 24px">▶ Google Play</div>
  <div style="background:#f1f3f4;border-radius:999px;padding:22px 28px;font-size:26px;color:#202124;display:flex;gap:16px"><span>🔍</span><span class="ty1" style="white-space:nowrap">Hindivine</span></div>
  <div class="app1" style="margin-top:50px">
   <div class="row"><div class="av" style="width:150px;height:150px;border-radius:36px"></div>
    <div><div style="font-size:38px;font-weight:800;color:#202124">Hindivine</div><div style="font-size:22px;color:#01875f;font-weight:700;margin-top:8px">Hindivine Healthcare Pvt Ltd</div><div style="font-size:20px;color:#5f6368;margin-top:6px">Patient app · Diet &amp; nutrition</div></div></div>
   <div style="position:relative;margin-top:44px;height:84px">
    <div class="ins" style="position:absolute;inset:0;border-radius:20px;background:#01875f;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center">Install</div>
    <div class="prog" style="position:absolute;inset:0;border-radius:20px;background:#e6f4ea;overflow:hidden"><div class="bar" style="height:100%;background:#01875f;width:0"></div></div>
    <div class="open" style="position:absolute;inset:0;border-radius:20px;background:#01875f;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center">Open</div>
   </div>
   <div style="display:flex;gap:16px;margin-top:40px">${['💬 Chat','🎙️ Voice','🥗 Diet'].map(x=>`<div style="flex:1;height:300px;border-radius:24px;background:linear-gradient(160deg,#29A8E0,#1170B5);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:flex-end;padding:20px">${x}</div>`).join('')}</div>
  </div></div>`,
 run(sc,t){typeIn(sc.querySelector('.ty1'),t+.6,1,9);fadeUp(sc.querySelector('.app1'),t+1.8,.7,40);
  tap(sc,270,535,t+2.9);an(sc.querySelector('.prog'),[{opacity:0},{opacity:1}],t+3.1,.2);
  an(sc.querySelector('.bar'),[{width:'0%'},{width:'100%'}],t+3.2,1.8,{ease:'ease-in-out'});
  an(sc.querySelector('.open'),[{opacity:0},{opacity:1}],t+5.1,.3);tap(sc,270,535,t+5.9);}},
{t:'Login with your mobile',s:'Enter your number, verify the OTP — or continue with Google.',html:`
 <div class="pad">
  <div style="text-align:center;margin-top:30px"><img src="branding.png" style="width:170px;border-radius:20px"></div>
  <div style="font-size:36px;font-weight:800;margin-top:26px">Welcome 👋</div>
  <div class="lbl" style="margin-top:6px">Login with your mobile number</div>
  <div class="card" style="margin-top:24px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;padding:26px">🇮🇳 +91 <span style="color:#c8d3de">|</span><span class="ty2" style="white-space:nowrap;letter-spacing:2px">98765 43210</span></div>
  <div class="otp" style="margin-top:26px"><div class="lbl">Enter the 6-digit OTP</div>
   <div style="display:flex;gap:12px;margin-top:14px">${[4,8,2,6,1,9].map(d=>`<div style="flex:1;height:86px;border-radius:18px;background:#fff;border:3px solid #cfe3f3;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:var(--blue)"><span class="od">${d}</span></div>`).join('')}</div></div>
  <div style="position:relative;height:84px;margin-top:30px"><div class="btn b1" style="position:absolute;inset:0">Send OTP</div><div class="btn b2" style="position:absolute;inset:0;background:linear-gradient(135deg,#22c55e,#15803d)">Verify &amp; Continue ✓</div></div>
  <div style="text-align:center;margin:26px 0;color:#9aa9b8;font-size:22px">— or —</div>
  <div class="card" style="text-align:center;font-size:26px;font-weight:700;padding:22px"><b style="color:#4285F4">G</b>&nbsp; Continue with Google</div>
 </div>`,
 run(sc,t){typeIn(sc.querySelector('.ty2'),t+.6,1.4,11);
  const otp=sc.querySelector('.otp');an(otp,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],t+2.6,.5);
  tap(sc,270,665,t+2.2);
  sc.querySelectorAll('.od').forEach((e,i)=>popIn(e,t+3.2+i*.25,.35));
  an(sc.querySelector('.b2'),[{opacity:0},{opacity:1}],t+4.8,.4);tap(sc,270,665,t+5.6);}},
{t:'Allow notifications',s:'Never miss a message, reminder or your new diet chart.',html:`
 <div class="pad" style="filter:none">
  <div class="dim" style="position:absolute;inset:-80px 0 0;padding:110px 30px 0">
   <div style="font-size:34px;font-weight:800">Namaste 👋</div>
   ${[1,2,3].map(()=>'<div class="card" style="height:200px;margin-top:24px"></div>').join('')}
  </div>
  <div class="shade" style="position:absolute;inset:-80px 0 0;background:rgba(6,25,45,.55)"></div>
  <div class="dlg card" style="position:absolute;left:40px;right:40px;top:330px;padding:40px;text-align:center;border-radius:36px">
   <div style="font-size:60px">🔔</div>
   <div style="font-size:28px;font-weight:800;margin-top:14px;line-height:1.3">Allow <span style="color:var(--blue)">Hindivine</span> to send you notifications?</div>
   <div style="display:flex;flex-direction:column;gap:14px;margin-top:30px"><div class="btn">Allow</div><div style="padding:20px;font-size:26px;font-weight:700;color:var(--mut)">Don't allow</div></div>
  </div>
  <div class="ban" style="position:absolute;left:20px;right:20px;top:0;background:rgba(255,255,255,.97);border-radius:30px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.2)">
   <div class="row"><div class="av" style="width:64px;height:64px;border-radius:16px"></div><div><div style="font-size:20px;color:var(--mut);font-weight:700">HINDIVINE · now</div><div style="font-size:24px;font-weight:800;margin-top:4px">Your dietitian sent a message 💬</div></div></div></div>
 </div>`,
 run(sc,t){const d=sc.querySelector('.dlg');popIn(d,t+.7,.7);tap(sc,270,700,t+2.6);
  an(d,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.85)'}],t+3,.4,{fill:'forwards'});
  an(sc.querySelector('.shade'),[{opacity:1},{opacity:0}],t+3,.5,{fill:'forwards'});
  an(sc.querySelector('.ban'),[{transform:'translateY(-300px)'},{transform:'translateY(0)'}],t+3.8,.7,{ease:'cubic-bezier(.34,1.4,.64,1)'});}},
{t:'Meet your care team',s:'Your Home screen connects you to your Hindivine dietitian.',html:`
 <div style="position:absolute;inset:0 0 auto;height:420px;background:linear-gradient(150deg,#29A8E0,#1170B5)"></div>
 <div class="pad" style="color:#fff">
  <div class="h0" style="margin-top:24px"><div style="font-size:24px;opacity:.85;font-weight:600">Good morning</div><div style="font-size:42px;font-weight:800">Namaste, Priya 👋</div></div>
  <div class="card c0" style="margin-top:40px;color:var(--ink)">
   <div class="row"><div class="av"></div><div><div style="font-size:28px;font-weight:800">Hindivine Nutrition Team</div><div style="font-size:21px;color:var(--green);font-weight:700;margin-top:4px">● Online · Your dietitian</div></div></div>
   <div class="btn" style="margin-top:24px;padding:20px">💬 Chat now</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;color:var(--ink)">
   ${[['🥗','My Diet Chart'],['💬','Messages'],['🎙️','Voice Notes'],['📈','My Progress']].map(([e,n])=>`<div class="card tile" style="height:200px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-size:54px">${e}</div><div style="font-size:26px;font-weight:800">${n}</div></div>`).join('')}
  </div></div>`,
 run(sc,t){fadeUp(sc.querySelector('.h0'),t+.5,.6,30);popIn(sc.querySelector('.c0'),t+1,.7);
  sc.querySelectorAll('.tile').forEach((e,i)=>popIn(e,t+1.7+i*.2,.6));tap(sc,270,435,t+4.6);}},
{t:'Chat & send voice notes',s:'Ask questions, share photos and reports, or just speak.',html:`
 <div style="position:absolute;inset:0 0 auto;height:200px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.06)"></div>
 <div class="pad">
  <div class="row" style="margin-top:20px;height:90px"><div style="font-size:34px;color:var(--blue)">‹</div><div class="av" style="width:70px;height:70px;border-radius:20px"></div><div><div style="font-size:26px;font-weight:800">Hindivine Dietitian</div><div style="font-size:20px;color:var(--green);font-weight:700">● online</div></div></div>
  <div style="margin-top:50px">
   <div class="bub in m1">Hello! How was your breakfast today? 😊</div>
   <div class="bub out m2">Had vegetable poha and green tea 🍵</div>
   <div class="bub out m3" style="padding:12px;width:324px"><div style="height:200px;width:300px;border-radius:20px;background:linear-gradient(135deg,#fde68a,#fb923c);display:flex;align-items:center;justify-content:center;font-size:110px">🥗</div></div>
   <div class="bub in m4" style="display:flex;align-items:center;gap:14px;width:380px"><div style="width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none">▶</div>
    <div style="display:flex;gap:5px;align-items:center;height:50px">${Array.from({length:22},(_,i)=>`<i class="wv" style="display:block;width:6px;border-radius:3px;background:var(--sky);height:${12+Math.abs(Math.sin(i*1.7))*36}px"></i>`).join('')}</div><span style="font-size:20px;color:var(--mut)">0:12</span></div>
  </div></div>
 <div style="position:absolute;left:24px;right:24px;bottom:30px;display:flex;gap:16px;align-items:center">
  <div class="card" style="flex:1;padding:24px;font-size:24px;color:#9aa9b8;border-radius:999px">Type a message…</div>
  <div class="mic" style="width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 0 0 rgba(239,68,68,.4)">🎙️</div></div>`,
 run(sc,t){['.m1','.m2','.m3','.m4'].forEach((s,i)=>an(sc.querySelector(s),[{opacity:0,transform:'translateY(40px) scale(.9)'},{opacity:1,transform:'none'}],t+.6+i*1.1,.5));
  const m=sc.querySelector('.mic');an(m,[{boxShadow:'0 0 0 0 rgba(239,68,68,.5)',transform:'scale(1)'},{boxShadow:'0 0 0 30px rgba(239,68,68,0)',transform:'scale(1.12)'}],t+3.6,.8,{it:3,fill:'none'});

const T0=9.5,SD=7.6;
const host=$('#steps');
STEPS.forEach((st,i)=>{const s=T0+i*SD;
  const el=document.createElement('div');el.className='scene';
  el.innerHTML=`<div class="stephead"><div class="badge"><b>${i+1}</b>STEP ${i+1} OF 7</div><div class="stitle">${st.t}</div><div class="ssub">${st.s}</div></div>
   <div class="phone"><div class="screen">${SB}${st.html}</div></div>
   <div class="dots">${STEPS.map((_,j)=>`<i class="${j==i?'on':''}"></i>`).join('')}</div>`;
  host.appendChild(el);
  sceneSpan(el,s,s+SD+.3);
  const head=el.querySelector('.stephead').children;
  fadeUp(head[0],s+.1,.6,30);fadeUp(head[1],s+.25,.7,40);fadeUp(head[2],s+.45,.7,30);
  an(el.querySelector('.phone'),[{opacity:0,transform:'translateY(260px) rotate(4deg)'},{opacity:1,transform:'none'}],s,.9);
  an(el.querySelector('.phone'),[{transform:'translateY(0)'},{transform:'translateY(-14px)'}],s+.9,SD-1.2,{ease:'ease-in-out',fill:'none'});
  st.run(el.querySelector('.screen'),s);
});
const TB=T0+7*SD; // benefits start
const BEN=[['💬','Private chat','Talk to your dietitian anytime, one-to-one.'],['🎙️','Voice notes','Just speak — in your own language.'],['🥗','Personal diet charts','Made for your body, goals and routine.'],['🩺','Health conditions','Diabetes, PCOS, thyroid, BP, heart & more.'],['🌱','Your food style','Veg, Jain, egg, non-veg or vegan.'],['📖','Recipe for every dish','Easy, home-style Indian meals.'],['🔔','Instant alerts','Replies, reminders & new charts.'],['🔒','Secure login','Safe mobile OTP sign-in.']];
const g=$('#bgrid');
BEN.forEach(([e,h,p],i)=>{const c=document.createElement('div');c.className='bcard glass';c.innerHTML=`<div class="ic">${e}</div><h3>${h}</h3><p>${p}</p>`;g.appendChild(c);
  an(c,[{opacity:0,transform:'translateY(80px) scale(.9)'},{opacity:1,transform:'none'}],TB+.8+i*.55,.7);});
sceneSpan('#benefits',TB,TB+11);
fadeUp('#benHead',TB+.2,.7);
const TC=TB+11;
sceneSpan('#cta',TC,TC+9);
popIn('#ctaLogo',TC+.3,.9);fadeUp('#ctaT',TC+.8,.8);fadeUp('#ctaS',TC+1.3);popIn('#ctaPlay',TC+1.8,.8);fadeUp('#ctaW',TC+2.4);fadeUp('#ctaC',TC+2.7);
an('#ctaPlay',[{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],TC+3.5,1.2,{it:4,fill:'none',ease:'ease-in-out'});
window.DURATION=TC+9;
document.getAnimations().forEach(a=>a.pause());
window.seek=t=>{for(const a of document.getAnimations()){a.currentTime=t*1000;}};
seek(0);
