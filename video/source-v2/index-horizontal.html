<!doctype html>
<html><head><meta charset="utf-8"><title>Hindivine App Video</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1170B5;--sky:#29A8E0;--deep:#062a4f;--ink:#0f2236;--mut:#5b6f85;--green:#16a34a}
html,body{width:1080px;height:1920px;overflow:hidden;background:#062a4f;font-family:Inter,'Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 20% 0%,#1a8ad6 0%,#0d5c9c 40%,#062a4f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h1{font-family:'Inter Display',Inter;font-weight:800;letter-spacing:-2px}
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}
/* step header */
.stephead{position:absolute;left:80px;right:80px;top:120px}
.badge{display:inline-flex;align-items:center;gap:14px;padding:12px 26px;border-radius:999px;font-weight:700;font-size:30px;letter-spacing:3px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.badge b{background:#fff;color:var(--blue);border-radius:999px;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;font-size:28px}
.stitle{font-family:'Inter Display';font-weight:800;font-size:76px;line-height:1.05;letter-spacing:-1.5px;margin-top:30px}
.ssub{font-size:36px;line-height:1.35;color:#cfe6fa;margin-top:20px;font-weight:500}
.dots{position:absolute;bottom:52px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.dots i{width:16px;height:16px;border-radius:99px;background:rgba(255,255,255,.3)}
.dots i.on{width:56px;background:#fff}
/* phone */
.phone{position:absolute;left:250px;top:600px;width:580px;height:1180px;border-radius:84px;background:#0b1622;padding:20px;box-shadow:0 60px 120px rgba(0,0,0,.45),0 0 0 3px #2a3a4d inset}
.screen{position:relative;width:100%;height:100%;border-radius:66px;overflow:hidden;background:#f3f7fb;color:var(--ink)}
.notch{position:absolute;top:16px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#0b1622;z-index:20}
.status{position:absolute;top:0;left:0;right:0;height:70px;display:flex;justify-content:space-between;align-items:center;padding:12px 52px 0;font-weight:700;font-size:22px;z-index:19}
.pad{position:absolute;top:80px;left:0;right:0;bottom:0;padding:0 30px}
.btn{border-radius:22px;padding:24px;text-align:center;font-weight:700;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--blue))}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 30px rgba(17,112,181,.12);padding:24px}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(17,112,181,.35);border:4px solid rgba(255,255,255,.9);opacity:0;z-index:30;box-shadow:0 0 0 8px rgba(17,112,181,.15)}
.lbl{font-size:22px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:18px}
.av{width:84px;height:84px;border-radius:24px;background:url(logo.png) center/cover;flex:none}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;background:#e6f2fb;color:var(--blue);font-weight:700;font-size:22px;margin:0 8px 10px 0}
.bub{max-width:400px;padding:20px 24px;border-radius:28px;font-size:24px;line-height:1.35;margin-bottom:18px}
.in{background:#fff;border-bottom-left-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.out{background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;margin-left:auto;border-bottom-right-radius:8px}
.meal{display:flex;align-items:center;gap:18px;background:#fff;border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:0 6px 16px rgba(17,112,181,.08)}
.meal .e{font-size:40px;width:64px;height:64px;border-radius:18px;background:#eef6fd;display:flex;align-items:center;justify-content:center;flex:none}
.meal .t{font-size:19px;color:var(--mut);font-weight:700;letter-spacing:1px}
.meal .d{font-size:23px;font-weight:700;margin-top:2px}
.meal .k{margin-left:auto;font-size:20px;color:var(--blue);font-weight:800;white-space:nowrap}
/* benefits */
.bgrid{position:absolute;left:70px;right:70px;top:430px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.bcard{border-radius:36px;padding:36px 32px;min-height:290px;opacity:0}
.bcard .ic{font-size:64px;width:110px;height:110px;border-radius:30px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.bcard h3{font-size:36px;line-height:1.15;font-weight:800;font-family:'Inter Display'}
.bcard p{font-size:25px;line-height:1.35;color:#cfe6fa;margin-top:10px}
.ov{position:absolute;left:60px;right:60px;top:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.ovi{border-radius:34px;padding:46px 16px;text-align:center;opacity:0}
.ovi .e{font-size:76px}
.ovi .n{font-size:28px;font-weight:700;margin-top:12px;line-height:1.2}
.sheetp{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:44px 44px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.18);padding:26px 30px 40px}
.grip{width:80px;height:8px;border-radius:9px;background:#dbe4ec;margin:0 auto 22px}
.ftile{border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.chk{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.cap{position:absolute;left:60px;right:60px;bottom:110px;text-align:center;font-size:34px;font-weight:600;line-height:1.35;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
</style><style>

</style>
</head>

  <div id="ctaPlay" style="margin-top:44px;display:flex;gap:24px"><div style="display:flex;align-items:center;gap:18px;background:#000;border:3px solid #9aa4ad;border-radius:24px;padding:18px 32px"><svg width="54" height="60" viewBox="0 0 30 33"><path d="M1 1l16 16L1 32z" fill="#00d7fe"/><path d="M1 1l21 12-5 4z" fill="#00f076"/><path d="M1 32l16-15 5 4z" fill="#f83a4b"/><path d="M22 13l6 3.5-6 3.5-5-3.5z" fill="#ffd400"/></svg><div style="text-align:left"><div style="font-size:19px;letter-spacing:1px;font-weight:600">GET IT ON</div><div style="font-size:40px;font-weight:700;margin-top:-4px;white-space:nowrap">Google Play</div></div></div><div style="display:flex;align-items:center;gap:18px;background:#000;border:3px solid #9aa4ad;border-radius:24px;padding:18px 32px"><svg width="50" height="60" viewBox="0 0 17 20"><path fill="#fff" d="M14 10.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8C4.6 5.4 3.1 6.3 2.3 7.8c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.4 2.9 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3 .8 2-1.2 2.8-2.3c.9-1.3 1.2-2.6 1.3-2.7-.1 0-2.5-.9-2.5-4.2zM11.8 3.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2.1-.5 2.7-1.3z"/></svg><div style="text-align:left"><div style="font-size:19px;letter-spacing:1px;font-weight:600">Download on the</div><div style="font-size:40px;font-weight:700;margin-top:-4px;white-space:nowrap">App Store</div></div></div></div>

<script>
const $=s=>document.querySelector(s);
const EASE='cubic-bezier(.2,.8,.2,1)';
function an(el,kf,start,dur,o={}){if(typeof el==='string')el=$(el);if(!el)return;
  el.animate(kf,{delay:start*1000,duration:dur*1000,fill:o.fill||'both',easing:o.ease||EASE,iterations:o.it||1});}
const fadeUp=(el,t,d=.8,dist=60)=>an(el,[{opacity:0,transform:`translateY(${dist}px)`},{opacity:1,transform:'none'}],t,d);
const popIn=(el,t,d=.7)=>an(el,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],t,d,{ease:'cubic-bezier(.34,1.56,.64,1)'});
const show=(el,t,d=.4)=>an(el,[{opacity:0},{opacity:1}],t,d);
const hide=(el,t,d=.4)=>an(el,[{opacity:1},{opacity:0}],t,d,{fill:'forwards'});
const slideUp=(el,t,d=.7,dist=700)=>an(el,[{transform:`translateY(${dist}px)`},{transform:'translateY(0)'}],t,d);
function sceneSpan(el,a,b){if(typeof el==='string')el=$(el);an(el,[{opacity:0},{opacity:1}],a,.6);an(el,[{opacity:1},{opacity:0}],b-.6,.6,{fill:'forwards'});}
function tap(screen,x,y,t){const d=document.createElement('div');d.className='tap';d.style.left=x+'px';d.style.top=y+'px';screen.appendChild(d);
  an(d,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)',offset:.35},{opacity:0,transform:'scale(1.6)'}],t,.9);}
function typeIn(el,t,d,n){an(el,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],t,d,{ease:`steps(${n})`});}
const q=(sc,s)=>sc.querySelector(s), qa=(sc,s)=>sc.querySelectorAll(s);

an('#b1',[{transform:'translate(0,0)'},{transform:'translate(300px,400px)'},{transform:'translate(0,0)'}],0,30,{ease:'ease-in-out',it:6});
an('#b2',[{transform:'translate(0,0)'},{transform:'translate(-300px,-500px)'},{transform:'translate(0,0)'}],0,26,{ease:'ease-in-out',it:7});
an('#b3',[{transform:'translate(0,0)'},{transform:'translate(-200px,500px)'},{transform:'translate(0,0)'}],0,34,{ease:'ease-in-out',it:6});

const SB='<div class="notch"></div><div class="status"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const CHATHEAD=`<div style="position:absolute;inset:0 0 auto;height:200px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.06);z-index:2"></div>
 <div class="row" style="position:absolute;top:100px;left:30px;z-index:3"><div style="font-size:34px;color:var(--blue)">‹</div><div class="av" style="width:70px;height:70px;border-radius:20px"></div><div><div style="font-size:26px;font-weight:800">Hindivine Dietitian</div><div style="font-size:20px;color:var(--green);font-weight:700">● online</div></div></div>`;
const INPUT=`<div style="position:absolute;left:24px;right:24px;bottom:30px;display:flex;gap:16px;align-items:center">
  <div class="card" style="flex:1;padding:24px;font-size:24px;color:#9aa9b8;border-radius:999px">📎 Type a message…</div>
  <div class="mic" style="width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#29A8E0,#1170B5);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff">➤</div></div>`;
const WAVE=(n,cls='wv',col='var(--sky)')=>`<div style="display:flex;gap:5px;align-items:center;height:50px">${Array.from({length:n},(_,i)=>`<i class="${cls}" style="display:block;width:6px;border-radius:3px;background:${col};height:${12+Math.abs(Math.sin(i*1.7))*36}px"></i>`).join('')}</div>`;
const FOODS=[['🥗','#bbf7d0','#22c55e'],['🍛','#fde68a','#f59e0b'],['🥣','#fecaca','#f87171'],['🍎','#fecdd3','#e11d48'],['🫓','#fed7aa','#ea580c'],['🍵','#d9f99d','#65a30d'],['🥛','#e0f2fe','#38bdf8'],['🍳','#fef08a','#eab308'],['🥜','#e7e5e4','#a8a29e']];
const ftile=(f,h)=>`<div class="ftile" style="height:${h}px;background:linear-gradient(135deg,${f[1]},${f[2]})">${f[0]}</div>`;

const SCENES=[
{key:'download',badge:'STEP 1',t:'Download the app',s:'Get it free on Google Play or the App Store.',html:`
 <div class="pad" style="background:#fff">
  <div style="display:flex;gap:12px;margin:20px 0 24px">
   <div class="stA" style="flex:1;text-align:center;padding:16px 0;border-radius:18px;font-size:23px;font-weight:800;background:#e6f4ea;color:#01875f">▶ Google Play</div>
   <div class="stB" style="flex:1;text-align:center;padding:16px 0;border-radius:18px;font-size:23px;font-weight:800;background:#e8f1ff;color:#0a66d8"><svg width="20" height="24" viewBox="0 0 17 20" style="vertical-align:-3px"><path fill="currentColor" d="M14 10.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8C4.6 5.4 3.1 6.3 2.3 7.8c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.4 2.9 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3 .8 2-1.2 2.8-2.3c.9-1.3 1.2-2.6 1.3-2.7-.1 0-2.5-.9-2.5-4.2zM11.8 3.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2.1-.5 2.7-1.3z"/></svg> App Store</div></div>
  <div style="background:#f1f3f4;border-radius:999px;padding:22px 28px;font-size:26px;color:#202124;display:flex;gap:16px"><span>🔍</span><span class="ty1" style="white-space:nowrap">Hindivine</span></div>
  <div class="app1" style="margin-top:50px">
   <div class="row"><div class="av" style="width:150px;height:150px;border-radius:36px"></div>
    <div><div style="font-size:38px;font-weight:800;color:#202124">Hindivine</div><div style="font-size:22px;color:var(--blue);font-weight:700;margin-top:8px">Hindivine Healthcare Pvt Ltd</div><div style="font-size:20px;color:#5f6368;margin-top:6px">Patient app · Diet &amp; nutrition</div></div></div>
   <div style="position:relative;margin-top:44px;height:84px">
    <div style="position:absolute;inset:0;border-radius:20px;background:var(--blue);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center">Install / Get</div>
    <div class="prog" style="position:absolute;inset:0;border-radius:20px;background:#e6f2fb;overflow:hidden"><div class="bar" style="height:100%;background:var(--blue);width:0"></div></div>
    <div class="open" style="position:absolute;inset:0;border-radius:20px;background:var(--blue);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center">Open</div>
   </div>
   <div style="display:flex;gap:16px;margin-top:40px">${['💬 Chat','🥗 Diet','📄 Reports'].map(x=>`<div style="flex:1;height:300px;border-radius:24px;background:linear-gradient(160deg,#29A8E0,#1170B5);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:flex-end;padding:20px">${x}</div>`).join('')}</div>
  </div></div>`,
 run(sc,t){popIn(q(sc,'.stA'),t+.4,.5);popIn(q(sc,'.stB'),t+.6,.5);typeIn(q(sc,'.ty1'),t+1,1,9);fadeUp(q(sc,'.app1'),t+2.1,.7,40);
  tap(sc,270,600,t+3.1);show(q(sc,'.prog'),t+3.3,.2);
  an(q(sc,'.bar'),[{width:'0%'},{width:'100%'}],t+3.4,1.5,{ease:'ease-in-out'});
  show(q(sc,'.open'),t+5,.3);tap(sc,270,600,t+5.6);}},
{key:'login',badge:'STEP 2',t:'Login with your mobile',s:'Enter your number and OTP — or continue with Google.',html:`
 <div class="pad">
  <div style="text-align:center;margin-top:30px"><img src="branding.png" style="width:170px;border-radius:20px"></div>
  <div style="font-size:36px;font-weight:800;margin-top:26px">Welcome 👋</div>
  <div class="lbl" style="margin-top:6px">Login with your mobile number</div>
  <div class="card" style="margin-top:24px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;padding:26px">🇮🇳 +91 <span style="color:#c8d3de">|</span><span class="ty2" style="white-space:nowrap;letter-spacing:2px">98765 43210</span></div>
  <div class="otp" style="margin-top:26px"><div class="lbl">Enter the 6-digit OTP</div>
   <div style="display:flex;gap:12px;margin-top:14px">${[4,8,2,6,1,9].map(d=>`<div style="flex:1;height:86px;border-radius:18px;background:#fff;border:3px solid #cfe3f3;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:var(--blue)"><span class="od">${d}</span></div>`).join('')}</div></div>
  <div style="position:relative;height:84px;margin-top:30px"><div class="btn" style="position:absolute;inset:0">Send OTP</div><div class="btn b2" style="position:absolute;inset:0;background:linear-gradient(135deg,#22c55e,#15803d)">Verify &amp; Continue ✓</div></div>
  <div style="text-align:center;margin:26px 0;color:#9aa9b8;font-size:22px">— or —</div>
  <div class="card gg" style="text-align:center;font-size:26px;font-weight:700;padding:22px"><b style="color:#4285F4">G</b>&nbsp; Continue with Google</div>

const OV=[['⬇️','Easy install'],['📱','Mobile OTP login'],['🩺','Care team'],['💬','Private chat'],['📈','Weekly progress'],['📸','Meal photos'],['📄','Reports & PDFs'],['🎬','Health videos'],['🥗','Diet charts'],['📖','Recipes'],['↗️','Save & share'],['🔒','Secure & offline']];
const BEN=[['💬','Private chat','Talk to your dietitian anytime, one-to-one.'],['📈','Weekly follow-up','New chart with fresh foods every week.'],['🥗','Personal diet charts','Made for your body, goals and routine.'],['🩺','Health conditions','Diabetes, PCOS, thyroid, BP, heart & more.'],['🌱','Your food style','Veg, Jain, egg, non-veg or vegan.'],['📖','Recipe for every dish','Easy, home-style Indian meals.'],['🎬','Health videos','Exercise & recipe guides in the app.'],['🔒','Secure & private','Safe login, chats saved on your phone.']];

// timeline from voiceover durations
const VO=window.VO||{};
const MIN={intro:6.5,overview:8,benefits:10.5,cta:9.5};
const ORDER=['intro','overview',...SCENES.map(s=>s.key),'benefits','cta'];
const START={},DUR={};let acc=0;
for(const k of ORDER){DUR[k]=Math.max(MIN[k]||7,(VO[k]||5)+1.6);START[k]=acc;acc+=DUR[k];}
window.TIMELINE={START,DUR,VO_LEAD:.5};window.DURATION=acc;

let s=START.intro;sceneSpan('#intro',s,s+DUR.intro+.3);
an('#introLogo',[{opacity:0,transform:'scale(.3) rotate(-20deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],s+.2,1.2,{ease:'cubic-bezier(.34,1.56,.64,1)'});
fadeUp('#introT1',s+1.1);fadeUp('#introT2',s+1.5);an('#introLine',[{width:'0px'},{width:'200px'}],s+2,.8);fadeUp('#introT3',s+2.4,.9);

s=START.overview;sceneSpan('#overview',s,s+DUR.overview+.3);fadeUp('#ovHead',s+.2,.7);
const og=$('#ovgrid');OV.forEach(([e,n],i)=>{const c=document.createElement('div');c.className='ovi glass';c.innerHTML=`<div class="e">${e}</div><div class="n">${n}</div>`;og.appendChild(c);popIn(c,s+.8+i*.22,.6);});

const host=$('#steps');const NS=SCENES.length;
SCENES.forEach((st,i)=>{const s=START[st.key],d=DUR[st.key];
  const el=document.createElement('div');el.className='scene';
  el.innerHTML=`<div class="stephead"><div class="badge"><b>${i+1}</b>${st.badge}</div><div class="stitle">${st.t}</div><div class="ssub">${st.s}</div></div>
   <div class="phone"><div class="screen">${SB}${st.html}</div></div>
   <div class="dots">${SCENES.map((_,j)=>`<i class="${j==i?'on':''}" style="${j==i?'width:40px':''}"></i>`).join('')}</div>`;
  host.appendChild(el);sceneSpan(el,s,s+d+.3);
  const h=el.querySelector('.stephead').children;fadeUp(h[0],s+.1,.6,30);fadeUp(h[1],s+.25,.7,40);fadeUp(h[2],s+.45,.7,30);
  an(el.querySelector('.phone'),[{opacity:0,transform:'translateY(260px) rotate(4deg)'},{opacity:1,transform:'none'}],s,.9);
  an(el.querySelector('.phone'),[{transform:'translateY(0)'},{transform:'translateY(-14px)'}],s+.9,d-1.2,{ease:'ease-in-out',fill:'none'});
  st.run(el.querySelector('.screen'),s);
});
s=START.benefits;const g=$('#bgrid');
BEN.forEach(([e,h,p],i)=>{const c=document.createElement('div');c.className='bcard glass';c.innerHTML=`<div class="ic">${e}</div><h3>${h}</h3><p>${p}</p>`;g.appendChild(c);
  an(c,[{opacity:0,transform:'translateY(80px) scale(.9)'},{opacity:1,transform:'none'}],s+.8+i*.55,.7);});
sceneSpan('#benefits',s,s+DUR.benefits+.3);fadeUp('#benHead',s+.2,.7);
s=START.cta;an('#cta',[{opacity:0},{opacity:1}],s,.6);an('#cta',[{opacity:1},{opacity:0}],s+DUR.cta-.8,.8,{fill:'forwards'});
popIn('#ctaLogo',s+.3,.9);fadeUp('#ctaT',s+.8,.8);fadeUp('#ctaS',s+1.3);popIn('#ctaPlay',s+1.8,.8);fadeUp('#ctaW',s+2.4);fadeUp('#ctaC',s+2.7);
an('#ctaPlay',[{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],s+3.5,1.2,{it:4,fill:'none',ease:'ease-in-out'});

document.getAnimations().forEach(a=>a.pause());
window.seek=t=>{for(const a of document.getAnimations()){a.currentTime=t*1000;}};
seek(0);
</script></body></html>
